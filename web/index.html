<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
             font-family: 'Trebuchet MS', 'Lucida Sans Unicode';
        }

        a{
            text-decoration: none ;
            color: white;
            font-size: 18px;
        }

        body{
            min-height: 100vh;
            
        }

        #hero{
            width: 100%;
            height: 100vh;
            background-image: url(./../flexbox/imagem.png);
            background-repeat: no-repeat;
            background-size: cover;
        }

        nav{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 10vh;
        }

        ul{
            display: flex;
            gap: 15px;
            list-style: none;
        }
        
        #logo{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode';
            font-size: 18px;
            text-transform: uppercase;
            margin-left: 20px;
            margin-right: 20px;
        }

        #content{
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        div span{
            color: #fff;
            font-weight: bold;
            font-size: 24px;
        }

          div h1{
            color: #fff;
            font-weight: bold;
            font-size: 86px;
        }

        button{
            color: white;
            font-size: 18px;
            border: 2px solid #fff;
            background-color: transparent;
            height: 40px;
            width: 200px;
            border-radius: 40px;
            transition: all 0.7s;
        }

        button:hover{
            cursor: pointer;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
        <div id="hero">
            <nav>
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Blog</a></li>
                    <li id="logo"><a href="">Albaino</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </nav>

            <div id="content">
                <span>PUT YOUR SUBTITLE HERE</span>
                <h1>Website Layout</h1>
                <button>MORE INFO ></button>
            </div>
        </div>

       
</body>
</html>
